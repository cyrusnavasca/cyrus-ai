name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: unit tests
        run: python -m unittest discover -t . -s tests -v
      - name: shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: end-to-end pipeline on synthetic data
        run: bash scripts/smoke_test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: unit tests
        run: npm test
      - name: build (includes type check)
        run: npm run build
